$kind: http-request
name: Update Current User Password
url: "{{base_url}}/api/v1/users/updateMyPassword"
method: PATCH
body:
  type: json
  content: "{\r

    \    \"passwordCurrent\":\"newpass\",\r

    \    \"password\":\"pass1234\",\r

    \    \"passwordConfirm\":\"pass1234\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{jwt}}"
scripts:
  - type: afterResponse
    code: pm.environment.set("jwt", pm.response.json().token);
    language: text/javascript
